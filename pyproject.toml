[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "document-intelligence-api"
version = "0.1.0"
description = "API for document processing and intelligent information retrieval"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.157",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "httpx>=0.28",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
