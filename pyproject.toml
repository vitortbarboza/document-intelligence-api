[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "document-intelligence-api"
version = "0.1.0"
description = "API for document processing and intelligent information retrieval"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.157",
    "uvicorn[standard]>=0.54",
    "python-multipart>=0.0.32",
    "pymupdf>=1.26,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "pydantic-settings>=2.16.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx2>=2.16",
    "ruff>=0.17.3",
    "pytest-cov>=7.1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Coverage is reported only when pytest runs with --cov; no minimum is enforced.
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E4",  # Import errors
    "E7",  # Statement errors
    "E9",  # Syntax errors
    "F",   # Pyflakes
    "I",   # Import sorting
    "B",   # Common bugs and bad practices
    "UP",  # Python modernization
]
