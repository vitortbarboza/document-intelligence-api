[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "document-intelligence-api"
version = "0.1.0"
description = "API for document processing and intelligent information retrieval"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.157",
    "uvicorn[standard]>=0.54",
    "python-multipart>=0.0.32",
    "pymupdf>=1.26,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx2>=2.16",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
